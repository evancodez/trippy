<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>trippi</title>
  <meta name="description" content="Op-art patterns you can warp, press figures up through, and play music into. Give it a song and it directs the song.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="trippi">
  <meta property="og:description" content="Op-art patterns you can warp, press figures up through, and play music into.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stage" aria-label="The picture: drag on it"></canvas>
  <div id="brush" class="brush"></div>

  <header id="mark" class="chrome glass">
    <b class="wordmark">trippi</b>
    <span id="lookName" class="look-name"></span>
  </header>
  <div id="corner" class="chrome"></div>

  <aside id="panel" class="glass chrome" hidden>
    <div id="panelHead" class="panel-head"></div>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <div id="bottom" class="chrome">
    <div id="transport" class="transport glass" hidden></div>
    <nav id="dock" class="dock glass"></nav>
  </div>

  <div id="hint" class="hint" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="drop" class="drop"><div>Drop a song, a picture or a video</div></div>
  <button id="unhide" class="unhide" aria-label="Show the menu"></button>
  <div id="fatal" class="fatal" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
